# Databases for local development. The API and the web app run natively
# (see docs/SETUP.md). Credentials here are for LOCAL USE ONLY.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/change_me   # must match NEO4J_PASSWORD in Backend/.env
    volumes:
      - neo4j_data:/data

volumes:
  mongo_data:
  neo4j_data:
